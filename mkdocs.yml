site_name: cfdb-ingest
site_description: File format conversions to cfdb
site_url: https://mullenkamp.github.io/cfdb-ingest/

repo_url: https://github.com/mullenkamp/cfdb-ingest
repo_name: mullenkamp/cfdb-ingest

theme:
    name: material
    icon:
        logo: material/library
    palette:
        # Palette toggle for light mode
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: deep orange
          accent: teal
          toggle:
            icon: material/brightness-7
            name: Switch to dark mode

        # Palette toggle for dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: deep orange
          accent: teal
          toggle:
            icon: material/brightness-4
            name: Switch to light mode

    features:
        - navigation.sections
        - navigation.expand
        - navigation.top
        - content.code.copy
        - toc.follow

markdown_extensions:
    - toc:
        permalink: true
    - admonition
    - pymdownx.details
    - pymdownx.highlight:
        anchor_linenums: true
    - pymdownx.tasklist:
        custom_checkbox: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences

plugins:
    - search
    - mkdocstrings:
        handlers:
            python:
                inventories:
                    - https://docs.python.org/3.11/objects.inv
                options:
                    docstring_style: google
                    show_root_heading: false
                    show_source: false

watch:
    - docs
    - cfdb_ingest

nav:
    - Home: index.md
    - Getting Started:
        - Installation: getting-started/installation.md
        - Quick Start: getting-started/quickstart.md
    - User Guide:
        - WRF Ingestion: guide/wrf-ingestion.md
        - ERA5 Ingestion: guide/era5-ingestion.md
        - WPS Export: guide/wps-export.md
    - Reference:
        - WRF Variables: reference/wrf-variables.md
        - ERA5 Variables: reference/era5-variables.md
        - API: reference/cfdb_ingest.md
    - Development: development.md
